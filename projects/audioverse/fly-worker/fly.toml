app = "audioverse-worker"
primary_region = "iad"  # Use same region as your Render app

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
  command = "celery -A audioverse worker --loglevel=info --concurrency=2"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0  # Scale to zero when idle to save money